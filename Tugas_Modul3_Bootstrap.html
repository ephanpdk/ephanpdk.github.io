<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desain Bootstrap - Form Registrasi</title>
    <!-- Memanggil file CSS Bootstrap dari CDN untuk kemudahan karena instruksi menggunakan hosting -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Gaya tambahan untuk footer agar selalu berada di bawah */
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
            background-color: #f8f9fa;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #e9ecef;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<main>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-sm-10">
                <h2 class="mb-4 text-center">Form Registrasi</h2>
                <form action="">
                    <div class="form-group">
                        <label for="name">Nama:</label>
                        <input type="text" class="form-control" id="name" placeholder="Name" name="nama" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" class="form-control" id="password" placeholder="Password" name="Password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="jk">Jenis Kelamin:</label>
                        <select class="form-control" id="jk" name="jenis_kelamin">
                            <option>Pria</option>
                            <option>Wanita</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary mt-3">Submit</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p class="mb-0"><strong>Tugas Praktikum Multimedia</strong></p>
        <p class="text-muted">Nama: Zephaniah Daniel Anis | NIM: 240211060059</p>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
